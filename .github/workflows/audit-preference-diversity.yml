name: Audit CAMP preference diversity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/audit-preference-diversity.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Print live top picks by preference
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {recommend} from './products.js';
          import {DEFAULT} from './engine.js';
          const products=JSON.parse(fs.readFileSync('./data/products.json')).products;
          const equipment=JSON.parse(fs.readFileSync('./data/equipment.json'));
          const rules=JSON.parse(fs.readFileSync('./data/recommendation-rules.json'));
          const profiles={
            tent:{party_type:'family',adults:2,children:2,season:'autumn',stay:'one_night',transport:'car',experiences:['bbq','bonfire','coffee'],budget:'100000',quantity:1,targetBudget:25000},
            default:{party_type:'couple',adults:2,children:0,season:'spring',stay:'one_night',transport:'car',experiences:['easy'],budget:'50000',quantity:2,targetBudget:20000}
          };
          for(const c of equipment.categories){
            const x=c.id==='tent'?profiles.tent:profiles.default;
            const a={...structuredClone(DEFAULT),...x};
            const out={};
            for(const pref of ['easy','comfort','compact','value']){
              const picks=recommend(products,c.id,a,equipment,rules,{preference:pref,quantity:x.quantity,targetBudget:x.targetBudget},Date.now());
              out[pref]=picks[0]?{model:picks[0].model,name:picks[0].name,price:picks[0].price}:null;
            }
            console.log('CATEGORY',c.id,JSON.stringify(out));
          }
          NODE
