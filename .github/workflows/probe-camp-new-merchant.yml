name: Requalify new CAMP merchant listings without publishing
on:
  pull_request:
    paths:
      - scripts/probe_camp_new_merchant.py
      - tests/test_probe_camp_new_merchant.py
      - .github/workflows/probe-camp-new-merchant.yml
  push:
    branches: [main]
    paths:
      - scripts/probe_camp_new_merchant.py
      - .github/workflows/probe-camp-new-merchant.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp-new-merchant-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test browser-to-official API evidence with bounded calls
        run: python -m unittest discover -s tests -p 'test_probe_camp_new_merchant.py' -v
      - name: Install normal Chrome driver without evasion
        if: github.event_name != 'pull_request'
        run: python -m pip install playwright==1.55.0
      - name: Check at most three independently named new listings
        if: github.event_name != 'pull_request'
        run: python scripts/probe_camp_new_merchant.py
      - name: Save review-only proof with no public offer timestamps
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: camp-new-merchant-requalification
          path: reports/camp-new-merchant-requalification.json
          retention-days: 14
          if-no-files-found: error
