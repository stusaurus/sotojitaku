name: Probe CAMP curated expansion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-curated-expansion.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact models
        shell: python
        run: |
          import json, urllib.parse, urllib.request, time
          base='https://daily-cost-api.kiyo0625puma.workers.dev/api/product-search'
          headers={'Origin':'https://stusaurus.github.io','Referer':'https://stusaurus.github.io/sotojitaku/','User-Agent':'sotojitaku-curated-probe/1.0'}
          models=['2000034775','2000034777','2190857','2199216','2000033139','2206796','2000038854','2000037352','2218363','UG-3005','UG-3086']
          for model in models:
            try:
              url=base+'?'+urllib.parse.urlencode({'q':model,'hits':20})
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=35) as r:data=json.load(r)
              print('===MODEL',model,'COUNT',data.get('count'),'===')
              for p in (data.get('products') or []):
                if str(p.get('product_no') or '').lower()==model.lower() or model.lower() in str(p.get('name') or '').lower():
                  print(json.dumps({
                    'model':model,'product_no':p.get('product_no'),'catalog_name':p.get('name'),
                    'ship_name':p.get('shipping_match_name'),'ship_url':p.get('shipping_included_url'),
                    'price':p.get('shipping_included_price'),'image':p.get('shipping_included_image'),
                    'reviewCount':p.get('review_count'),'reviewAverage':p.get('review_average')
                  },ensure_ascii=False))
            except Exception as e:
              print('ERROR',model,type(e).__name__,str(e)[:180])
            time.sleep(1.0)
