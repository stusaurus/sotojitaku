name: Public SOTOJITAKU smoke QA

on:
  pull_request:
    paths:
      - 'index.html'
      - 'camp/**'
      - 'car-stay/**'
      - 'fishing/**'
      - 'assets/analytics-context.js'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'tests/public-smoke.cjs'
      - 'tests/home-guide-browser.cjs'
      - 'tests/public-http.mjs'
      - '.github/workflows/public-smoke.yml'
  workflow_dispatch:
  schedule:
    - cron: '7 0 * * 1'

permissions:
  contents: read

jobs:
  public-http:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live HOME, services and affiliate destinations
        env:
          SOTOJITAKU_BASE: https://stusaurus.github.io/sotojitaku/
        run: node tests/public-http.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sotojitaku-public-http-proof
          path: browser-proof/public/http-results.json
          retention-days: 14

  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        timeout-minutes: 7
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify candidate HOME guide entries in 3 PR-preview viewports
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 4173 > /tmp/soto-guide-preview.log 2>&1 &
          HOME_BASE=http://127.0.0.1:4173/ node tests/home-guide-browser.cjs
      - name: Inspect all four published experiences and catalog links
        env:
          SOTOJITAKU_BASE: https://stusaurus.github.io/sotojitaku/
          REQUIRE_HOME_GUIDES: ${{ github.event_name != 'pull_request' && '1' || '0' }}
        run: node tests/public-smoke.cjs
      - name: Save browser proof and JSON results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sotojitaku-public-qa
          path: browser-proof/public/
          retention-days: 14
