name: Refresh audited camping products
on:
  push:
    branches: [main]
    paths: ['scripts/**', 'data/audited-products.json', '.github/workflows/refresh-products.yml']
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: sotojitaku-products
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve verified listings (fail closed)
        run: python scripts/refresh_worker.py
      - run: npm test
      - name: Save refreshed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified camping product catalog'
            git push
          fi
      - name: Prepare static site
        run: |
          mkdir public
          cp index.html qa.html app.js engine.js products.js style.css robots.txt sitemap.xml .nojekyll public/
          cp -r assets data camp-guide public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish refreshed data to Pages
        id: deployment
        uses: actions/deploy-pages@v4
