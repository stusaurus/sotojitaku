name: Refresh FISHING products
on:
  push:
    branches: [main]
    paths:
      - 'fishing/data/product-seeds/**'
      - 'fishing/scripts/check_catalog.py'
      - '.github/workflows/refresh-fishing-products.yml'
  pull_request:
    paths:
      - 'fishing/**'
      - 'tests/fishing-*.test.mjs'
      - 'tests/test_fishing_*.py'
      - '.github/workflows/refresh-fishing-products.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 22 * * *'

permissions:
  contents: write

concurrency:
  group: sotojitaku-fishing-products-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate FISHING code and seed matrix
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate exhaustive diagnosis-to-product scenarios
        run: node fishing/scripts/check_scenarios.mjs

  refresh-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download shared verified FISHING catalog
        run: |
          curl --fail --silent --show-error --location             --retry 3 --retry-delay 2             https://raw.githubusercontent.com/stusaurus/daily-cost-jp/main/shared-data/sotojitaku-fishing-products.json             -o /tmp/fishing-products.json

      - name: Validate shared catalog freshness and shape
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p=Path('/tmp/fishing-products.json')
          data=json.loads(p.read_text())
          updated=data.get('updatedAt')
          if not updated:
              raise SystemExit('shared catalog missing updatedAt')
          ts=datetime.fromisoformat(str(updated).replace('Z','+00:00'))
          age=(datetime.now(timezone.utc)-ts).total_seconds()
          if age < 0 or age > 48*3600:
              raise SystemExit(f'shared catalog stale: {age/3600:.1f}h')

          products=data.get('products')
          if not isinstance(products,list) or not products:
              raise SystemExit('shared catalog has no verified products')

          for item in products:
              if item.get('audit',{}).get('status')!='verified_live':
                  raise SystemExit('unverified product present')
              if not str(item.get('affiliateUrl','')).startswith('https://hb.afl.rakuten.co.jp/'):
                  raise SystemExit('invalid affiliate URL present')
              if not str(item.get('itemUrl','')).startswith('https://item.rakuten.co.jp/'):
                  raise SystemExit('invalid Rakuten item URL present')
              if not isinstance(item.get('price'),int) or item['price']<=0:
                  raise SystemExit('invalid price present')
              if not str(item.get('image','')).startswith('https://'):
                  raise SystemExit('invalid image present')

          print('shared catalog verified:',len(products),'failed seeds:',len(data.get('failures',{})))
          PY

      - name: Stage shared catalog for coverage validation
        run: cp /tmp/fishing-products.json fishing/data/audited-products.json

      - name: Validate repository
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Require core live product coverage
        run: python fishing/scripts/check_catalog.py

      - name: Run exhaustive diagnosis-to-product audit
        run: node fishing/scripts/check_scenarios.mjs

      - name: Publish verified FISHING catalog safely
        run: |
          cp fishing/data/audited-products.json /tmp/fishing-products-ready.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/fishing-products-ready.json fishing/data/audited-products.json
            git add fishing/data/audited-products.json
            if git diff --cached --quiet; then
              echo "FISHING catalog already current."
              exit 0
            fi
            git commit -m 'Refresh verified FISHING product catalog'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
