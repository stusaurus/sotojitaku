# Explicit one-shot, two-model read-only research. Do not publish either listing.
name: CAMP new maker models (two read-only seller proofs)
on:
  pull_request:
    paths:
      - 'scripts/probe_camp_new_model_merchants.py'
      - 'tests/test_probe_camp_new_model_merchants.py'
      - '.github/workflows/probe-camp-new-model-merchants.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp-new-model-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-new-model-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove maker-source, merchant-price, exact SKU, API and halt conditions offline
        run: python -m unittest discover -s tests -p 'test_probe_camp_new_model_merchants.py' -v
      - name: Permit only one explicitly marked live research run
        id: live
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || git log -1 --format=%B | grep -Fq '[camp-new-model-live]'; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
          else
            echo 'approved=false' >> "$GITHUB_OUTPUT"
            echo 'No real seller/API calls during ordinary pull request checks.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install ordinary Chromium browser client
        if: steps.live.outputs.approved == 'true'
        run: python -m pip install playwright==1.55.0
      - name: Probe at most two independently listed items and stop on Rakuten 429
        if: steps.live.outputs.approved == 'true'
        run: python scripts/probe_camp_new_model_merchants.py
      - name: Save sanitized research report only
        if: always() && steps.live.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: camp-new-model-readonly-discovery
          path: reports/camp-new-model-merchant-research.json
          if-no-files-found: warn
          retention-days: 14
