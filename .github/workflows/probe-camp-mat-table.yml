name: Probe CAMP mat and table original seller evidence
on:
  pull_request:
    paths:
      - 'scripts/probe_camp_mat_table.py'
      - 'tests/test_probe_camp_mat_table.py'
      - '.github/workflows/probe-camp-mat-table.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/probe_camp_mat_table.py'
      - '.github/workflows/probe-camp-mat-table.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp-mat-table-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify read-only bounded candidate selection and rate-limit safeguards
        run: |
          python -m unittest discover -s tests -p 'test_probe_camp_mat_table.py' -v
          python -m unittest discover -s tests -p 'test_probe_camp_next_categories.py' -v
      - name: Install standard Chrome driver (no access bypass)
        if: github.event_name != 'pull_request'
        run: python -m pip install playwright==1.55.0
      - name: Independently probe audited mat and table sellers, at most 3 lookups
        if: github.event_name != 'pull_request'
        run: python scripts/probe_camp_mat_table.py
      - name: Preserve nonpublic research evidence
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: camp-original-mat-table-proofs
          path: reports/camp-mat-table-proof.json
          retention-days: 14
          if-no-files-found: error
