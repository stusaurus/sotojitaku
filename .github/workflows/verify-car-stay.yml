name: Verify CAR STAY protected journeys
on:
  push:
    branches: [main, car-stay-final-20261007]
    paths: ['car-stay/**', 'tests/car-stay-browser.mjs', '.github/workflows/verify-car-stay.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: node --test tests/car-stay*.test.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Five steps, safety, fit, telemetry and responsive screens
        run: |
          python -m http.server 4173 > /tmp/car-stay-server.log 2>&1 &
          node tests/car-stay-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-stay-browser-proof
          path: browser-proof/car-stay/
