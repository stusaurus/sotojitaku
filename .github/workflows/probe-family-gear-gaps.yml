name: Probe CAMP exact fire pits
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-family-gear-gaps.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact fire pit models
        shell: python
        run: |
          import json, urllib.parse, urllib.request, time
          base='https://daily-cost-api.kiyo0625puma.workers.dev/api/product-search'
          headers={'Origin':'https://stusaurus.github.io','Referer':'https://stusaurus.github.io/sotojitaku/','User-Agent':'sotojitaku-firepit-probe/1.0'}
          models=['ST-033R','ST-032RS','2205811']
          for model in models:
            for attempt in range(3):
              try:
                url=base+'?'+urllib.parse.urlencode({'q':model,'hits':20})
                req=urllib.request.Request(url,headers=headers)
                with urllib.request.urlopen(req,timeout=35) as r:data=json.load(r)
                print('===MODEL',model,'COUNT',data.get('count'),'===')
                for p in (data.get('products') or [])[:20]:
                  print(json.dumps({
                    'model':model,'product_no':p.get('product_no'),'catalog_name':p.get('name'),
                    'ship_name':p.get('shipping_match_name'),'ship_url':p.get('shipping_included_url'),
                    'price':p.get('shipping_included_price'),'image':p.get('shipping_included_image'),
                    'reviewCount':p.get('review_count'),'reviewAverage':p.get('review_average')
                  },ensure_ascii=False))
                break
              except Exception as e:
                print('RETRY',model,attempt+1,type(e).__name__,str(e)[:160])
                if attempt==2: print('ERROR',model)
                time.sleep(3*(attempt+1))
            time.sleep(1)
