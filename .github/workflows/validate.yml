name: Verify SOTOJITAKU CAMP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soto-core-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - name: Stamp asset fingerprints before release checks
        run: python scripts/stamp_assets.py
      # Inventory availability is a live business-health gate, not a source-code
      # regression. Growth audit still runs the unfiltered npm test and alerts.
      - name: Verify static safety and dated catalog regression contracts
        run: npm run test:non-camp-live
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
