name: Refresh FISHING products
on:
  push:
    branches: [main]
    paths:
      - 'fishing/scripts/refresh_products.py'
      - 'fishing/data/product-seeds/**'
      - 'fishing/scripts/check_catalog.py'
      - '.github/workflows/refresh-fishing-products.yml'
  pull_request:
    paths:
      - 'fishing/**'
      - 'tests/fishing-*.test.mjs'
      - 'tests/test_fishing_*.py'
      - '.github/workflows/refresh-fishing-products.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 22 * * *'
permissions:
  contents: write
concurrency:
  group: sotojitaku-fishing-products-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate FISHING code and seed matrix
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v

  refresh-main:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm Rakuten credential scope
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          python - <<'PY'
          import os
          keys=['RAKUTEN_APPLICATION_ID','RAKUTEN_ACCESS_KEY','RAKUTEN_AFFILIATE_ID']
          ok=all(os.environ.get(k,'').strip() for k in keys)
          print('Rakuten credentials:', 'available' if ok else 'missing')
          if not ok:
              raise SystemExit(1)
          PY
      - name: Refresh exact FISHING listings
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: python fishing/scripts/refresh_products.py
      - name: Show fail-closed coverage
        run: |
          python - <<'PY'
          import json
          p=json.load(open('fishing/data/audited-products.json'))
          print('verified', len(p.get('products',[])))
          print('failed', len(p.get('failures',{})))
          for k,v in p.get('failures',{}).items():
              print('FAIL', k, v)
          PY
      - name: Validate repository
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Require core live product coverage
        run: python fishing/scripts/check_catalog.py
      - name: Publish refreshed FISHING catalog safely
        run: |
          cp fishing/data/audited-products.json /tmp/fishing-products.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/fishing-products.json fishing/data/audited-products.json
            git add fishing/data/audited-products.json
            if git diff --cached --quiet; then
              echo "FISHING catalog already current."
              exit 0
            fi
            git commit -m 'Refresh verified FISHING product catalog'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
