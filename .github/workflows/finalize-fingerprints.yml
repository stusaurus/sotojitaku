name: Finalize CAMP asset fingerprints
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-fingerprints.yml']
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp dependency and release fingerprints
        run: python scripts/stamp_assets.py
      - name: Commit stamped assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize CAMP release fingerprints'
            git push
          fi
