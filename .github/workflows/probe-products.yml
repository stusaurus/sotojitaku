name: Probe camping product worker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-products.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe exact JAN lookups
        shell: python
        run: |
          import json, urllib.parse, urllib.request, time
          base='https://daily-cost-api.kiyo0625puma.workers.dev/api/shipping-lookup'
          headers={'Origin':'https://stusaurus.github.io','Referer':'https://stusaurus.github.io/sotojitaku/','User-Agent':'sotojitaku-probe/1.0'}
          cases=[
            ('fire','4992826711122','Coleman ファイアーディスク 2000031235','Coleman'),
            ('burner','4953571073101','SOTO レギュレーターストーブ ST-310','SOTO')
          ]
          for label,code,name,brand in cases:
            url=base+'?'+urllib.parse.urlencode({'code':code,'name':name,'brand':brand})
            try:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                data=json.load(r)
              print('===',label,'===')
              print(json.dumps(data,ensure_ascii=False))
            except Exception as e:
              print('ERROR',label,type(e).__name__,str(e)[:160])
            time.sleep(1.2)
