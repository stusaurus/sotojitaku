name: Refresh CAR STAY products
on:
  push:
    branches: [main]
    paths:
      - 'car-stay/scripts/refresh_products.py'
      - 'car-stay/scripts/merge_product_shards.py'
      - 'car-stay/scripts/report_coverage.mjs'
      - 'car-stay/data/product-seeds/**'
      - 'car-stay/data/vehicles.json'
      - 'tests/car-stay*.test.mjs'
      - 'tests/test_car_stay*.py'
      - '.github/workflows/refresh-car-stay-products.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 21 * * *'
permissions:
  contents: write
concurrency:
  group: sotojitaku-car-stay-products-v3
  cancel-in-progress: true

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Rakuten API secret availability
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          python - <<'PY'
          import os
          print("CAR_STAY_RAKUTEN_SECRET_STATUS", {
              "application_id": bool(os.getenv("RAKUTEN_APPLICATION_ID")),
              "access_key": bool(os.getenv("RAKUTEN_ACCESS_KEY")),
              "affiliate_id": bool(os.getenv("RAKUTEN_AFFILIATE_ID")),
          })
          PY
      - name: Audit CAR STAY shard
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          CAR_STAY_REFRESH_SHARD_TOTAL: '8'
          CAR_STAY_REFRESH_SHARD_INDEX: ${{ matrix.shard }}
          CAR_STAY_REFRESH_BUDGET_SECONDS: '240'
          CAR_STAY_REFRESH_OUTPUT: /tmp/car-stay-products-${{ matrix.shard }}.json
        run: python car-stay/scripts/refresh_products.py
      - uses: actions/upload-artifact@v4
        with:
          name: car-stay-products-${{ matrix.shard }}
          path: /tmp/car-stay-products-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: car-stay-products-*
          path: /tmp/car-stay-shards
          merge-multiple: true
      - name: Fetch shared audited CAR STAY catalog
        run: |
          if ! curl -fsSL --retry 2 --connect-timeout 8 --max-time 25 \
            https://raw.githubusercontent.com/stusaurus/daily-cost-jp/main/shared-data/sotojitaku-car-stay-products.json \
            -o /tmp/car-stay-shared.json; then
            echo '{"version":1,"products":[]}' > /tmp/car-stay-shared.json
          fi
      - name: Merge CAR STAY shard catalogs
        run: python car-stay/scripts/merge_product_shards.py /tmp/car-stay-shards car-stay/data/audited-products.json /tmp/car-stay-shared.json car-stay/data/product-seeds
      - name: Build CAR STAY revenue coverage report
        run: node car-stay/scripts/report_coverage.mjs
      - name: Validate CAMP and CAR STAY
        run: |
          python scripts/stamp_assets.py
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish refreshed CAR STAY catalog safely
        run: |
          cp car-stay/data/audited-products.json /tmp/car-stay-products.json
          cp car-stay/data/coverage-report.json /tmp/car-stay-coverage.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$GITHUB_SHA" origin/main -- \
              car-stay/scripts/refresh_products.py \
              car-stay/scripts/merge_product_shards.py \
              car-stay/scripts/report_coverage.mjs \
              car-stay/data/product-seeds \
              car-stay/data/vehicles.json \
              .github/workflows/refresh-car-stay-products.yml; then
              echo "A newer CAR STAY audit definition exists on main; skip stale catalog publish."
              exit 0
            fi
            git reset --hard origin/main
            cp /tmp/car-stay-products.json car-stay/data/audited-products.json
            cp /tmp/car-stay-coverage.json car-stay/data/coverage-report.json
            git add car-stay/data/audited-products.json car-stay/data/coverage-report.json
            if git diff --cached --quiet; then
              echo "CAR STAY catalog already current."
              exit 0
            fi
            git commit -m 'Refresh verified CAR STAY product catalog'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main moved during CAR STAY catalog push; retrying ($attempt/3)."
            sleep $((attempt * 2))
          done
          echo "Could not publish CAR STAY catalog after three safe retries."
          exit 1
