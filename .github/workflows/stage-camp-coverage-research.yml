name: CAMP coverage recovery (read-only)
on:
  pull_request:
    paths:
      - 'scripts/stage_camp_coverage_round.py'
      - 'tests/test_stage_camp_coverage_round.py'
      - '.github/workflows/stage-camp-coverage-research.yml'
  workflow_dispatch:
    inputs:
      round:
        description: 'One bounded product evidence batch: family or sleep'
        type: choice
        required: true
        default: family
        options:
          - family
          - sleep
permissions:
  contents: read
concurrency:
  group: camp-coverage-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-coverage-candidates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify six-request cap, identity checks, 429 stop and unchanged production data
        run: python -m unittest discover -s tests -p 'test_stage_camp_coverage_round.py' -v
      - name: Install only ordinary seller-page proof client
        run: python -m pip install playwright==1.55.0
      - name: Reverify original exact seller SKU into temporary runner files only
        run: python scripts/stage_camp_coverage_round.py --round "${{ inputs.round || 'family' }}"
      - name: Run unchanged strict CAMP gates on confirmed temporary evidence only
        run: |
          test -f /tmp/camp-coverage-review-products.json
          test -f /tmp/camp-coverage-review-audits.json
          cp /tmp/camp-coverage-review-products.json data/products.json
          cp /tmp/camp-coverage-review-audits.json data/audited-products.json
          python scripts/report_camp_refresh.py
          python scripts/stamp_assets.py
          npm run check
          npm test
      - name: Preserve sanitized evidence and exact remaining failure counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camp-coverage-readonly-review
          path: |
            reports/camp-coverage-research.json
            reports/camp-refresh-health.json
          if-no-files-found: warn
          retention-days: 14
