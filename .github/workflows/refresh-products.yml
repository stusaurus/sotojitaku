name: Refresh audited camping products
on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'
permissions:
  contents: write
concurrency:
  group: sotojitaku-products
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve verified listings (fail closed)
        run: python scripts/refresh_worker.py
      - run: npm test
      - name: Save refreshed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified camping product catalog'
            git push
          fi
