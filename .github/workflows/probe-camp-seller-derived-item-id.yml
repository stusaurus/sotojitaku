name: CAMP seller-derived item ID (two bounded read-only sellers)
on:
  pull_request:
    paths:
      - 'scripts/probe_camp_seller_derived_item_id.py'
      - 'tests/test_probe_camp_seller_derived_item_id.py'
      - '.github/workflows/probe-camp-seller-derived-item-id.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp-seller-derived-item-id-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-original-seller-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove no guessed slug, strict fixed variant, nonpublication, and bounded API calls
        run: python -m unittest discover -s tests -p 'test_probe_camp_seller_derived_item_id.py' -v
      - name: Explicitly authorize this one bounded live research pass
        id: approval
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || git log -1 --format=%B | grep -Fq '[camp-live-proof]'; then
            echo 'live=true' >> "$GITHUB_OUTPUT"
          else
            echo 'live=false' >> "$GITHUB_OUTPUT"
            echo 'No live seller/API requests on routine PR updates.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install ordinary browser for seller-page proof
        if: steps.approval.outputs.live == 'true'
        run: python -m pip install playwright==1.55.0
      - name: Check two other previously audited models at their new seller URLs
        if: steps.approval.outputs.live == 'true'
        run: |
          set -euo pipefail
          python scripts/probe_camp_seller_derived_item_id.py --candidate sandwich
          python - <<'PY'
          import json,sys
          from pathlib import Path
          path=Path('reports/camp-seller-derived-item-id-sandwich.json')
          result=json.loads(path.read_text())
          if result['apiStatus'] in ('rate_limited','worker_unavailable'):
              print('Upstream unavailable: stop before next listing')
              sys.exit(2)
          PY
          sleep 3
          python scripts/probe_camp_seller_derived_item_id.py --candidate fire
      - name: Preserve sanitized discovery report only
        if: always() && steps.approval.outputs.live == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: camp-seller-derived-item-id-readonly
          path: reports/camp-seller-derived-item-id-*.json
          retention-days: 14
          if-no-files-found: warn
