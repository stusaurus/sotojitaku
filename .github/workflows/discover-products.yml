name: Discover audited camping product candidates
on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_products.py'
      - 'data/product-seeds.json'
      - '.github/workflows/discover-products.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sotojitaku-product-discovery
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact model listings
        run: python scripts/discover_products.py
      - name: Save candidate report safely
        run: |
          cp data/product-candidates.json /tmp/product-candidates.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/product-candidates.json data/product-candidates.json
            git add data/product-candidates.json
            if git diff --cached --quiet; then
              echo "Candidate report already current."
              exit 0
            fi
            git commit -m 'Update camping product candidate audit report'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main moved during candidate report push; retrying ($attempt/3)."
            sleep $((attempt * 2))
          done
          echo "Could not publish candidate report after three safe retries."
          exit 1
