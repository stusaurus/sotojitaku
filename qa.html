<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOTOJITAKU CAMP — viewport verification</title><style>body{margin:0;background:#d8cbb8;font:14px sans-serif;color:#23382d}header{padding:12px 20px;display:flex;gap:20px;align-items:center}select{padding:8px}main{display:flex;justify-content:center;padding:10px 0}iframe{border:0;background:#f4f0e7;width:390px;height:844px;max-width:100%;box-shadow:0 12px 40px #23382d33}</style><header><strong>SOTOJITAKU CAMP / 表示検証</strong><label>画面幅 <select id="width"><option>320</option><option selected>390</option><option>760</option><option>1280</option></select></label><a href="index.html?test=1">サイトを開く</a></header><main><iframe id="phone" title="スマホ表示のSOTOJITAKU CAMP" src="index.html?test=1"></iframe></main><details><summary>計測イベント確認</summary><pre id="events"></pre></details><script>window.addEventListener("message",e=>{if(e.origin===location.origin&&e.data?.type==="sotojitaku-test-event")document.querySelector("#events").textContent+=JSON.stringify(e.data)+"\n";});document.querySelector('#width').addEventListener('change',e=>{document.querySelector('iframe').style.width=e.target.value+'px';document.querySelector('iframe').style.height=e.target.value==='1280'?'900px':'844px';});</script></html>
