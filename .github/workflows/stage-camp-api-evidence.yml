name: Stage CAMP official API evidence
on:
  pull_request:
    paths:
      - 'scripts/stage_camp_api_evidence.py'
      - 'tests/test_stage_camp_api_evidence.py'
      - 'scripts/probe_camp_recovery_candidates.py'
      - 'tests/test_probe_camp_recovery_candidates.py'
      - 'scripts/stage_camp_recovery_pair.py'
      - 'tests/test_stage_camp_recovery_pair.py'
      - 'tests/verified-camp-snapshot.test.mjs'
      - '.github/workflows/stage-camp-api-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/stage_camp_api_evidence.py'
      - '.github/workflows/stage-camp-api-evidence.yml'
  workflow_dispatch:
    inputs:
      offset:
        description: "Number of distinct CAMP categories to skip (0, 2, 4, 6 or 8)"
        type: number
        required: false
        default: 0
permissions:
  contents: read
concurrency:
  group: camp-api-evidence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact identity, postage, ranges and throttling protections
        run: python -m unittest discover -s tests -p 'test_stage_camp_api_evidence.py' -v
      - name: Test bounded missing-category research and 429 safeguards
        run: python -m unittest discover -s tests -p 'test_probe_camp_recovery_candidates.py' -v
      - name: Test strict temporary catalog evaluation and no-publication behavior
        run: python -m unittest discover -s tests -p 'test_stage_camp_recovery_pair.py' -v
      - name: Opt-in only for live seller API and inventory research
        id: live
        shell: bash
        run: |
          message="$(git log -1 --format=%B)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || printf '%s' "$message" | grep -Fq '[camp-live-proof]'; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
          else
            echo 'approved=false' >> "$GITHUB_OUTPUT"
            echo 'Live product evidence NOT checked: unit tests only. No publication approval.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Install ordinary seller browser only for review proof
        if: github.event_name == 'pull_request' && steps.live.outputs.approved == 'true'
        run: python -m pip install playwright==1.55.0
      - name: Reverify LED, tent, burners and family tables into temporary catalog only
        if: github.event_name == 'pull_request' && steps.live.outputs.approved == 'true'
        run: python scripts/stage_camp_recovery_pair.py
      - name: Test temporary candidate against all CAMP recommendation checks
        if: github.event_name == 'pull_request' && steps.live.outputs.approved == 'true'
        run: |
          cp /tmp/camp-recovery-candidate-products.json data/products.json
          cp /tmp/camp-recovery-candidate-audits.json data/audited-products.json
          python scripts/report_camp_refresh.py
          python scripts/stamp_assets.py
          npm run check
          npm test
      - name: Stage at most two separate CAMP categories (read only)
        if: github.event_name != 'pull_request'
        run: python scripts/stage_camp_api_evidence.py --offset "${{ inputs.offset || 0 }}" --limit 2
      - name: Preserve bounded nonpublishing research report
        if: always() && (github.event_name != 'pull_request' || steps.live.outputs.approved == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: camp-api-evidence-candidates
          path: |
            reports/camp-api-evidence-candidates.json
            reports/camp-missing-categories-research.json
            reports/camp-recovery-pair-candidate.json
            reports/camp-refresh-health.json
          if-no-files-found: warn
          retention-days: 14
