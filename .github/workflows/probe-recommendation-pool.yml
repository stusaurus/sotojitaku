name: Probe CAMP recommendation pool
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-recommendation-pool.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe strict name lookups
        shell: python
        run: |
          import json, urllib.parse, urllib.request, time
          base='https://daily-cost-api.kiyo0625puma.workers.dev/api/shipping-lookup'
          headers={'Origin':'https://stusaurus.github.io','Referer':'https://stusaurus.github.io/sotojitaku/','User-Agent':'sotojitaku-pool-probe/1.0'}
          cases=[
            ('st340','','SOTO レギュレーターストーブ Range ST-340','SOTO'),
            ('st350','','SOTO レギュレーターストーブ TriTrail ST-350','SOTO'),
            ('hotsand','','Coleman ホットサンドイッチクッカー 1709435','Coleman')
          ]
          for label,code,name,brand in cases:
            try:
              url=base+'?'+urllib.parse.urlencode({'code':code,'name':name,'brand':brand})
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=35) as r:data=json.load(r)
              print('===',label,'===')
              print(json.dumps(data,ensure_ascii=False))
            except Exception as e:print('ERROR',label,type(e).__name__,str(e)[:160])
            time.sleep(1.2)
