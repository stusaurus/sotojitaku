name: A8 Xebio CAMP banner QA
on:
  pull_request:
    paths:
      - 'assets/a8-xebio-camp.*'
      - 'camp/app.js'
      - 'camp/index.html'
      - 'tests/a8-xebio-camp*'
      - '.github/workflows/a8-xebio-camp-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  xebio-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JS and exact A8 code
        run: |
          npm run check
          node --check assets/a8-xebio-camp.js
          node --test tests/a8-xebio-camp.test.mjs tests/analytics-contract.test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test CAMP store on phone and desktop without sending A8 clicks
        run: |
          python -m http.server 4173 >/tmp/soto-xebio-server.log 2>&1 &
          node tests/a8-xebio-camp-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xebio-camp-viewport-proof
          path: browser-proof/xebio-camp/
          if-no-files-found: ignore
          retention-days: 14
