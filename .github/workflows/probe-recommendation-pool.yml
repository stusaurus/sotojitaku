name: Probe CAMP recommendation pool
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-recommendation-pool.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe final lightweight chair
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          base='https://daily-cost-api.kiyo0625puma.workers.dev/api/shipping-lookup'
          headers={'Origin':'https://stusaurus.github.io','Referer':'https://stusaurus.github.io/sotojitaku/','User-Agent':'sotojitaku-pool-probe/1.0'}
          url=base+'?'+urllib.parse.urlencode({'name':'Coleman コンパクトクッションチェア ブラック 2000038833','brand':'Coleman'})
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req,timeout=35) as r:data=json.load(r)
          print(json.dumps(data,ensure_ascii=False))
