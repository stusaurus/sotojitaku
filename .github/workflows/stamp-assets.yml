name: Validate content fingerprints (read only)
on:
  pull_request:
    paths:
      - 'app.js'
      - 'camp/app.js'
      - 'camp/index.html'
      - 'index.html'
      - 'home.css'
      - 'style.css'
      - 'engine.js'
      - 'products.js'
      - 'scripts/stamp_assets.py'
      - 'tests/assets.test.mjs'
      - '.github/workflows/stamp-assets.yml'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'camp/app.js'
      - 'camp/index.html'
      - 'index.html'
      - 'home.css'
      - 'style.css'
      - 'engine.js'
      - 'products.js'
      - 'scripts/stamp_assets.py'
      - 'tests/assets.test.mjs'
      - '.github/workflows/stamp-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: soto-fingerprint-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fingerprints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Candidate/production artifacts get correctly fingerprinted on their own
      # runner. No bot push to main, and no race with the Pages release workflow.
      - name: Regenerate asset fingerprints for the checked-out candidate
        run: python scripts/stamp_assets.py
      - name: Verify content fingerprints against actual asset bytes
        run: node --test tests/assets.test.mjs
      - name: Report regenerated files (no commit, no push)
        run: |
          echo 'Asset references that needed regeneration in this runner:'
          git diff --name-only
          echo 'The static publishing workflow repeats stamping before packaging.'
