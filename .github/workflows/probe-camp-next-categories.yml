name: Verify two CAMP category seller proofs
on:
  pull_request:
    paths:
      - 'scripts/probe_camp_next_categories.py'
      - 'tests/test_probe_camp_next_categories.py'
      - '.github/workflows/probe-camp-next-categories.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/probe_camp_next_categories.py'
      - '.github/workflows/probe-camp-next-categories.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp-two-category-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit-test two independent exact seller proofs with no network
        run: python -m unittest discover -s tests -p 'test_probe_camp_next_categories.py' -v
      - name: Install normal Playwright Chrome driver
        if: github.event_name != 'pull_request'
        run: python -m pip install playwright==1.55.0
      - name: Probe at most two originally audited listings without publication
        if: github.event_name != 'pull_request'
        run: python scripts/probe_camp_next_categories.py
      - name: Save research-only evidence report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: camp-tent-chair-original-seller-proof
          path: reports/camp-next-categories-proof.json
          retention-days: 14
          if-no-files-found: error
