name: Probe CAMP catalog expansion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-catalog-expansion.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe differentiated product models
        shell: python
        run: |
          import json, urllib.parse, urllib.request, time
          base='https://daily-cost-api.kiyo0625puma.workers.dev/api/product-search'
          headers={'Origin':'https://stusaurus.github.io','Referer':'https://stusaurus.github.io/sotojitaku/','User-Agent':'sotojitaku-catalog-probe/1.0'}
          models=['2000038771','2000022267','2218350','2000038838','2190855','2219642','2219647']
          for model in models:
            try:
              url=base+'?'+urllib.parse.urlencode({'q':model,'hits':20})
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=35) as r:data=json.load(r)
              print('===MODEL',model,'COUNT',data.get('count'),'===')
              for p in (data.get('products') or []):
                txt=' '.join(str(p.get(k) or '') for k in ['product_no','name','shipping_match_name'])
                if model.lower() in txt.lower():
                  print(json.dumps({'model':model,'product_no':p.get('product_no'),'catalog_name':p.get('name'),'ship_name':p.get('shipping_match_name'),'ship_url':p.get('shipping_included_url'),'price':p.get('shipping_included_price'),'image':p.get('shipping_included_image'),'reviewCount':p.get('review_count'),'reviewAverage':p.get('review_average')},ensure_ascii=False))
            except Exception as e:
              print('ERROR',model,type(e).__name__,str(e)[:180])
            time.sleep(1.2)
