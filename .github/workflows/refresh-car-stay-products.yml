name: Refresh CAR STAY products
on:
  push:
    branches: [main]
    paths:
      - 'car-stay/scripts/refresh_products.py'
      - 'car-stay/scripts/merge_product_shards.py'
      - 'car-stay/data/product-seeds/**'
      - '.github/workflows/refresh-car-stay-products.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 21 * * *'
permissions:
  contents: write
concurrency:
  group: sotojitaku-car-stay-products-v3
  cancel-in-progress: true

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit CAR STAY shard
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          CAR_STAY_REFRESH_SHARD_TOTAL: '3'
          CAR_STAY_REFRESH_SHARD_INDEX: ${{ matrix.shard }}
          CAR_STAY_REFRESH_BUDGET_SECONDS: '300'
          CAR_STAY_REFRESH_OUTPUT: /tmp/car-stay-products-${{ matrix.shard }}.json
        run: python car-stay/scripts/refresh_products.py
      - uses: actions/upload-artifact@v4
        with:
          name: car-stay-products-${{ matrix.shard }}
          path: /tmp/car-stay-products-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: car-stay-products-*
          path: /tmp/car-stay-shards
          merge-multiple: true
      - name: Merge CAR STAY shard catalogs
        run: python car-stay/scripts/merge_product_shards.py /tmp/car-stay-shards car-stay/data/audited-products.json
      - name: Validate CAMP and CAR STAY
        run: |
          npm run check
          npm test
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish refreshed CAR STAY catalog safely
        run: |
          cp car-stay/data/audited-products.json /tmp/car-stay-products.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/car-stay-products.json car-stay/data/audited-products.json
            git add car-stay/data/audited-products.json
            if git diff --cached --quiet; then
              echo "CAR STAY catalog already current."
              exit 0
            fi
            git commit -m 'Refresh verified CAR STAY product catalog'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main moved during CAR STAY catalog push; retrying ($attempt/3)."
            sleep $((attempt * 2))
          done
          echo "Could not publish CAR STAY catalog after three safe retries."
          exit 1
