name: Probe final three CAMP seller categories
on:
  pull_request:
    paths:
      - scripts/probe_camp_final_three.py
      - tests/test_probe_camp_final_three.py
      - .github/workflows/probe-camp-final-three.yml
  push:
    branches: [main]
    paths:
      - scripts/probe_camp_final_three.py
      - .github/workflows/probe-camp-final-three.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: camp-final-three-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test six-call ceiling, exact selection, 429 and no publication
        run: |
          python -m unittest discover -s tests -p 'test_probe_camp_final_three.py' -v
          python -m unittest discover -s tests -p 'test_probe_camp_next_categories.py' -v
      - name: Install ordinary Chrome without access evasion
        if: github.event_name != 'pull_request'
        run: python -m pip install playwright==1.55.0
      - name: Read at most six original sellers and only after exact Item API match
        if: github.event_name != 'pull_request'
        run: python scripts/probe_camp_final_three.py
      - name: Keep proof record for independent review
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: camp-final-three-seller-proofs
          path: reports/camp-final-three-evidence.json
          retention-days: 14
          if-no-files-found: error
