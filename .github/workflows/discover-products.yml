name: Discover audited camping product candidates
on:
  push:
    branches: [main]
    paths:
      - 'scripts/discover_products.py'
      - 'data/product-seeds.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sotojitaku-product-discovery
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect exact model listings
        run: python scripts/discover_products.py
      - name: Save candidate report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/product-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update camping product candidate audit report'
            git pull --rebase origin main
            git push
          fi
