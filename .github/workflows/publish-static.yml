name: Publish verified SOTOJITAKU site
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'home.css'
      - 'assets/home-world-*'
      - 'camp/**'
      - 'tests/home-browser.cjs'
      - 'tests/home-guide-browser.cjs'
      - 'scripts/check_release_head.py'
      - 'tests/car-stay-published-catalog.mjs'
      - 'tests/test_release_head_guard.py'
      - 'fishing/**'
      - 'car-stay/**'
      - 'tests/car-stay-browser.mjs'
      - 'tests/fishing-browser.mjs'
      - 'tests/fishing-published-catalog.mjs'
      - '.github/workflows/publish-static.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: sotojitaku-static-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - name: Stamp asset fingerprints before release checks
        run: python scripts/stamp_assets.py
      # Source-code and fail-closed shopping checks must pass before deploy.
      # Incomplete live CAMP category coverage is measured (and still fails)
      # in the independent Growth funnel and catalog audit, not here.
      - name: Verify all product services without the five live inventory gates
        run: npm run test:non-camp-live
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verify mobile and desktop journeys
        run: |
          python -m http.server 4173 > /tmp/fishing-server.log 2>&1 &
          node tests/home-browser.cjs
          node tests/fishing-browser.mjs
          node tests/car-stay-browser.mjs
          node tests/car-stay-power-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fishing-browser-proof
          path: browser-proof/
      # Both the catalog refresh and a content PR may update main. Never
      # publish an artifact built from a superseded main commit.
      - name: Check latest main before packaging
        id: release_head
        run: python scripts/check_release_head.py
      - name: Prepare complete static site
        if: steps.release_head.outputs.publish == 'true'
        run: |
          mkdir public
          cp home.css index.html qa.html app.js engine.js products.js style.css robots.txt sitemap.xml googlef35e71acece62b67.html .nojekyll public/
          cp -r assets data guides camp car-stay fishing public/
      - uses: actions/upload-pages-artifact@v3
        if: steps.release_head.outputs.publish == 'true'
        with:
          path: public
      # A product update can land while the Pages artifact is uploading.
      # Recheck immediately before deploy; concurrency cancels older runs
      # when the newer push schedules its own release.
      - name: Recheck latest main immediately before deployment
        id: release_head_final
        if: steps.release_head.outputs.publish == 'true'
        run: python scripts/check_release_head.py
      - name: Publish complete site
        if: steps.release_head_final.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HOME editorial links and their destinations
        if: steps.release_head_final.outputs.publish == 'true'
        env:
          HOME_BASE: https://stusaurus.github.io/sotojitaku/
        run: node tests/home-guide-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-published-guide-proof
          path: browser-proof/public/home-guide-links-*.png
          retention-days: 14
      - name: Verify published CAR STAY catalog exactly matches verified main
        if: steps.release_head_final.outputs.publish == 'true'
        env:
          CAR_STAY_BASE: https://stusaurus.github.io/sotojitaku/car-stay/
        run: node tests/car-stay-published-catalog.mjs
      - name: Verify published FISHING catalog exactly matches verified main
        if: steps.release_head_final.outputs.publish == 'true'
        env:
          FISHING_BASE: https://stusaurus.github.io/sotojitaku/fishing/
        run: node tests/fishing-published-catalog.mjs
      - name: Verify published FISHING desktop and mobile purchase journeys
        if: steps.release_head_final.outputs.publish == 'true'
        env:
          FISHING_BASE: https://stusaurus.github.io/sotojitaku/fishing/
          FISHING_WIDTHS: '320,390,1440'
        run: node tests/fishing-browser.mjs
      - name: Verify published CAR STAY desktop and mobile journeys
        if: steps.release_head_final.outputs.publish == 'true'
        env:
          CAR_STAY_BASE: https://stusaurus.github.io/sotojitaku/car-stay/
        run: node tests/car-stay-browser.mjs
      - name: Verify published CAR STAY power calculator at three screen widths
        if: steps.release_head_final.outputs.publish == 'true'
        env:
          CAR_STAY_POWER_BASE: https://stusaurus.github.io/sotojitaku/car-stay/power/
        run: node tests/car-stay-power-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: car-stay-published-browser-proof
          path: browser-proof/car-stay/
