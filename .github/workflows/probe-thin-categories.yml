name: Probe CAMP thin categories
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-thin-categories.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe product candidates
        shell: python
        run: |
          import json, urllib.parse, urllib.request, time
          base='https://daily-cost-api.kiyo0625puma.workers.dev/api/product-search'
          headers={'Origin':'https://stusaurus.github.io','Referer':'https://stusaurus.github.io/sotojitaku/','User-Agent':'sotojitaku-thin-probe/1.0'}
          queries=[
            'コールマン 寝袋 C10','コールマン 寝袋 C15','キャプテンスタッグ シュラフ',
            'Coleman ヒーリングチェア','Coleman インフィニティチェア','CAPTAIN STAG チェア',
            'Coleman LEDランタン 600','Coleman ハンギングEライト','LEDランタン キャンプ コールマン',
            'CAPTAIN STAG 焚き火台','UNIFLAME ファイアグリル','焚き火台 コールマン',
            'CAPTAIN STAG ホットサンドメーカー','Coleman ホットサンドイッチクッカー','ホットサンドメーカー 直火 キャンプ'
          ]
          for q in queries:
            try:
              url=base+'?'+urllib.parse.urlencode({'q':q,'hits':12})
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=35) as r:data=json.load(r)
              print('===QUERY',q,'COUNT',data.get('count'),'===')
              for p in (data.get('products') or [])[:10]:
                print(json.dumps({
                  'product_no':p.get('product_no'),'catalog_name':p.get('name'),
                  'ship_name':p.get('shipping_match_name'),'ship_url':p.get('shipping_included_url'),
                  'price':p.get('shipping_included_price'),'image':p.get('shipping_included_image'),
                  'reviewCount':p.get('review_count'),'reviewAverage':p.get('review_average')
                },ensure_ascii=False))
            except Exception as e:
              print('ERROR',q,type(e).__name__,str(e)[:180])
            time.sleep(1.0)
