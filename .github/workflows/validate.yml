name: Verify SOTOJITAKU CAMP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - name: Stamp asset fingerprints before release checks
        run: python scripts/stamp_assets.py
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
