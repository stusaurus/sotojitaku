name: Hinata rental ad PR browser preflight
on:
  pull_request:
    paths:
      - 'camp/**'
      - 'app.js'
      - 'assets/a8-hinata-rental.js'
      - 'style.css'
      - 'scripts/stamp_assets.py'
      - 'tests/hinata-rental*'
      - '.github/workflows/a8-hinata-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamp source imports and check JS before browser tests
        run: |
          python scripts/stamp_assets.py
          npm run check
          node --test tests/hinata-rental.test.mjs tests/assets.test.mjs tests/analytics-contract.test.mjs
      - name: Install isolated Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test CAMP rental UI without external affiliate requests
        run: |
          python -m http.server 4173 >/tmp/sotojitaku-hinata-server.log 2>&1 &
          node tests/hinata-rental-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hinata-rental-browser-proof
          path: browser-proof/hinata-rental/
          if-no-files-found: ignore
          retention-days: 14
